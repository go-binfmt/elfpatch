name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      # The differential lane needs the reference tool and a compiler. It is
      # REQUIRED here: ELFPATCH_REQUIRE_DIFF turns its skip into a failure, so a
      # runner image that loses patchelf cannot turn the lane into a green tick.
      - name: reference tools (patchelf, gcc, readelf)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf gcc binutils
          patchelf --version
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # -race and -count=1: a cached PASS must not stand in for this run. The
      # committed fuzz corpus (testdata/fuzz/FuzzParse) replays as ordinary tests.
      - name: test, including the differential lane against patchelf
        env: { ELFPATCH_REQUIRE_DIFF: "1" }
        run: go test -race -count=1 -v -run 'Differential' ./...
      - name: test everything else
        run: go test -race -count=1 ./...

  # The layout engine is a port of patchelf 0.19.3. Against that release built
  # from its tag, the growth cases must agree on more than the semantic fields:
  # the same PT_LOAD flags, the same file size and the same program and section
  # header tables (readelf -l -S), byte for byte in readelf's rendering.
  layout-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: patchelf 0.19.3 from its tag, gcc, readelf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf gcc binutils cmake g++
          git clone -q --depth 1 --branch 0.19.3 https://github.com/NixOS/patchelf.git "$RUNNER_TEMP/patchelf-src"
          cmake -S "$RUNNER_TEMP/patchelf-src" -B "$RUNNER_TEMP/patchelf-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/patchelf-build" -j4
          "$RUNNER_TEMP/patchelf-build/src/patchelf" --version
      - name: growth cases, strict layout comparison
        env:
          ELFPATCH_REQUIRE_DIFF: "1"
          ELFPATCH_LAYOUT_STRICT: "1"
        run: |
          export ELFPATCH_PATCHELF="$RUNNER_TEMP/patchelf-build/src/patchelf"
          go test -count=1 -v -run 'DifferentialGrowth' ./...

  # 32-bit: every offset is an int there, and a bound that is only right in
  # 64 bits is the kind of bug a 64-bit lane cannot show. Runs natively on the
  # amd64 runner.
  test-386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: reference tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf gcc binutils
      - name: go test (GOARCH=386)
        env: { GOARCH: '386', CGO_ENABLED: '0', ELFPATCH_REQUIRE_DIFF: "1" }
        run: go test -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: fuzz FuzzParse for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 60s .
      - name: fuzz FuzzGrow (the layout engine) for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzGrow$' -fuzztime 60s .

  # s390x is BIG-ENDIAN; the synthetic images cover both byte orders, and this
  # lane runs the code itself under that byte order.
  s390x:
    name: test (s390x, qemu, big-endian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user qemu-user-binfmt
          q=qemu-s390x-static; command -v "$q" >/dev/null 2>&1 || q=qemu-s390x
          echo "QEMU_EXEC=$q" >> "$GITHUB_ENV"
      - name: go test (GOARCH=s390x under qemu)
        env:
          CGO_ENABLED: '0'
          GOARCH: s390x
          GOOS: linux
          # host tools cannot be exec'd from inside the emulator
          ELFPATCH_SKIP_DIFF: "emulated: host patchelf/gcc cannot be exec'd from qemu-user"
        run: |
          echo "running s390x under $QEMU_EXEC"
          go test -count=1 -exec "$QEMU_EXEC" ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: riscv64 }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
          - { goos: linux,   goarch: loong64 }
          - { goos: linux,   goarch: '386' }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: netbsd,  goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }} (CGO=0)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  darwin:
    name: test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go test -count=1 ./...

  # Single core, interleaved rounds, against the same patchelf the differential
  # lane uses. The table is printed into the job summary; README quotes it.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf gcc binutils
      - run: |
          go build -o "$RUNNER_TEMP/elfpatch" ./cmd/elfpatch
          go build -o "$RUNNER_TEMP/bench" ./internal/bench
          uptime
          taskset -c 0 "$RUNNER_TEMP/bench" -patchelf "$(command -v patchelf)" -elfpatch "$RUNNER_TEMP/elfpatch" -rounds 60 | tee "$RUNNER_TEMP/bench.md"
          cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"
